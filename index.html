<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxege Technologies - UI Concept</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
</head>
<body>

    <div class="min-h-screen bg-gradient-to-br from-[#004F60] via-[#04151C] to-[#04151C] text-white font-sans">
      
      <nav class="flex justify-between items-center p-6 border-b border-[#00E5FF]/20">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-full border-2 border-[#00E5FF] flex items-center justify-center font-bold text-[#00E5FF]">OT</div>
          <div class="text-2xl font-bold tracking-widest text-[#00E5FF]">OXEGE<span class="text-white text-sm font-normal ml-2 tracking-normal">TECHNOLOGIES</span></div>
        </div>
        
        <ul class="hidden md:flex space-x-8 text-sm font-medium text-[#E2E8F0]">
          <li class="hover:text-[#00E5FF] hover:-translate-y-0.5 transform transition cursor-pointer">Home</li>
          <li class="hover:text-[#00E5FF] hover:-translate-y-0.5 transform transition cursor-pointer">Services</li>
          <li class="hover:text-[#00E5FF] hover:-translate-y-0.5 transform transition cursor-pointer">Portfolio</li>
          <li class="hover:text-[#00E5FF] hover:-translate-y-0.5 transform transition cursor-pointer">About Us</li>
        </ul>
        
        <button class="px-6 py-2 bg-transparent border border-[#00E5FF] text-[#00E5FF] hover:bg-[#00E5FF] hover:text-[#04151C] font-semibold rounded-md shadow-[0_0_15px_rgba(0,229,255,0.3)] hover:shadow-[0_0_20px_rgba(0,229,255,0.6)] transition-all duration-300">
          Contact Us
        </button>
      </nav>

      <div class="flex flex-col items-center justify-center text-center mt-32 px-4 max-w-4xl mx-auto">
        <div class="inline-block px-4 py-1 rounded-full border border-[#00E5FF]/30 bg-[#00E5FF]/10 text-[#00E5FF] text-xs font-semibold mb-6 tracking-wide">
          NEXT-GEN IT SOLUTIONS
        </div>
        
        <h1 class="text-5xl md:text-7xl font-extrabold mb-6 leading-tight">
          Innovating The Future With <br> 
          <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#00E5FF] to-[#53A6B4]">Oxege Technologies</span>
        </h1>
        
        <p class="text-[#E2E8F0] max-w-2xl mb-10 text-lg md:text-xl leading-relaxed">
          Empowering businesses through cutting-edge web development, scalable software solutions, and digital transformation.
        </p>
        
        <div class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-6">
           <button class="px-8 py-3 bg-[#00E5FF] text-[#04151C] font-bold rounded-md hover:bg-[#53A6B4] shadow-[0_0_15px_rgba(0,229,255,0.4)] transition-all duration-300">
             Explore Services
           </button>
           <button class="px-8 py-3 border border-[#E2E8F0]/30 text-[#E2E8F0] rounded-md hover:border-[#00E5FF] hover:text-[#00E5FF] transition-all duration-300">
             Our Portfolio
           </button>
        </div>
      </div>
      
    </div>

</body>
</html>
